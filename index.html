<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffecf7">
    <title>하트 요정의 보석 왕관</title>
    <link rel="stylesheet" href="./styles.css?v=6">
  </head>
  <body>
    <main class="app">
      <header class="hud">
        <div class="title-wrap">
          <p class="eyebrow">하트 요정의</p>
          <h1>보석 왕관</h1>
        </div>
        <div class="progress-card" aria-label="별 잡은 개수">
          <span class="progress-label">별</span>
          <div class="gem-slots" id="gemSlots" aria-hidden="true">
            <span class="slot"></span>
            <span class="slot"></span>
            <span class="slot"></span>
          </div>
          <strong id="score">0 / 3</strong>
        </div>
      </header>

      <section class="stage" id="stage" aria-label="마법 놀이 화면">
        <video class="stage-camera hidden" id="camera" autoplay muted playsinline></video>
        <canvas class="hand-overlay hidden" id="handOverlay" aria-hidden="true"></canvas>
        <div class="camera-tint hidden" id="cameraTint" aria-hidden="true"></div>
        <div class="sky-glow"></div>
        <div class="cloud cloud-left"></div>
        <div class="cloud cloud-right"></div>
        <div class="sparkles" id="sparkles" aria-hidden="true"></div>

        <div class="castle" aria-hidden="true">
          <div class="tower tower-left"><span></span></div>
          <div class="palace">
            <div class="window window-left"></div>
            <div class="window window-right"></div>
            <div class="door"></div>
          </div>
          <div class="tower tower-right"><span></span></div>
        </div>

        <div class="head-crown hidden" id="headCrown" aria-hidden="true">
          <div class="crown">
            <i class="crown-gem crown-gem-1 filled"></i>
            <i class="crown-gem crown-gem-2 filled"></i>
            <i class="crown-gem crown-gem-3 filled"></i>
          </div>
          <p>공주님 왕관!</p>
        </div>

        <div class="crown-board hidden" id="crownBoard" aria-hidden="true">
          <div class="crown">
            <i class="crown-gem crown-gem-1"></i>
            <i class="crown-gem crown-gem-2"></i>
            <i class="crown-gem crown-gem-3"></i>
          </div>
          <p>공주님의 왕관</p>
        </div>

        <button class="target-gem hidden" id="targetGem" type="button" aria-label="움직이는 마법 별">
          <span class="hold-ring"></span>
          <span class="gem-heart">✦</span>
          <span class="target-label">손으로 잡아요</span>
        </button>

        <div class="wand-pointer hidden" id="wandPointer" aria-hidden="true">
          <span>✦</span>
        </div>

        <p class="guide" id="guide">마법 놀이를 시작해 볼까요?</p>
        <p class="status hidden" id="status" aria-live="polite"></p>
      </section>

      <div class="parent-tools">
        <button class="text-button hidden" id="togglePreview" type="button">카메라 보기</button>
        <button class="text-button hidden" id="restart" type="button">처음부터</button>
      </div>
    </main>

    <section class="welcome" id="welcome">
      <div class="welcome-card">
        <div class="fairy-mark" aria-hidden="true">♥</div>
        <p class="welcome-kicker">공주님을 위한 마법 놀이</p>
        <h2>하트 요정의<br>보석 왕관</h2>
        <p class="welcome-copy">손을 천천히 움직여<br>반짝이는 별 3개를 잡아 주세요.</p>
        <button class="primary-button" id="startCamera" type="button">손으로 시작하기</button>
        <button class="secondary-button" id="startDemo" type="button">화면으로 먼저 체험하기</button>
        <p class="parent-note" id="parentNote">부모님: 카메라는 기기 안에서 손의 위치를 찾는 데만 사용합니다.</p>
      </div>
    </section>

    <section class="celebration hidden" id="celebration" aria-live="polite">
      <div class="celebration-card">
        <p class="celebration-stars">✦ ♥ ✦</p>
        <h2>왕관 완성!</h2>
        <p>공주님이 보석 왕관을 완성했어요!</p>
        <button class="primary-button" id="playAgain" type="button">한 번 더</button>
      </div>
    </section>

    <script type="module" src="./app.js?v=7"></script>
  </body>
</html>
